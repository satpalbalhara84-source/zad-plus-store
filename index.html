
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zad Plus Technology | Online Store</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:white;padding:15px;position:sticky;top:0;z-index:5}
.nav{max-width:1150px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:800;font-size:21px}
.logo span{color:#38bdf8}
button{cursor:pointer}
.cartbtn{background:white;color:#111827;border:0;border-radius:9px;padding:11px;font-weight:bold}
.hero{background:linear-gradient(135deg,#111827,#1d4ed8);color:white;padding:45px 18px}
.wrap{max-width:1150px;margin:auto;padding:20px 18px}
.hero h1{font-size:36px;margin:0 0 10px}
.hero p{margin:0}
.cats{display:flex;gap:8px;overflow-x:auto;margin-bottom:20px}
.cats button{border:1px solid #ddd;background:white;border-radius:20px;padding:10px 15px;white-space:nowrap}
.cats button.active{background:#1d4ed8;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:17px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px #0001}
.pic{height:185px;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:55px}
.pic img{width:100%;height:100%;object-fit:contain}
.info{padding:15px}
.name{font-weight:bold;min-height:40px}
.price{font-size:22px;font-weight:800;margin:10px 0}
.stock{font-size:13px;color:#64748b;margin-bottom:10px}
.add,.primary{width:100%;background:#2563eb;color:white;border:0;border-radius:9px;padding:12px;font-weight:bold}
.primary{background:#16a34a}
button:disabled{opacity:.55;cursor:not-allowed}
.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:20;overflow:auto;padding:12px}
.modal{max-width:650px;background:white;margin:20px auto;padding:22px;border-radius:16px;position:relative}
.close{position:absolute;right:12px;top:10px;border:0;border-radius:50%;width:34px;height:34px;font-size:21px}
.cartrow{padding:12px 0;border-bottom:1px solid #eee}
.qty{display:flex;align-items:center;gap:9px;margin-top:8px}
.qty button{padding:6px 10px;border:1px solid #ddd;border-radius:6px;background:white}
.field{margin-bottom:12px}
.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px}
.field textarea{min-height:75px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{display:none;padding:12px;border-radius:8px;white-space:pre-wrap;margin-bottom:12px}
.error{display:block;background:#fee2e2;color:#991b1b}
.success{display:block;background:#dcfce7;color:#166534}
.empty{text-align:center;padding:35px}
footer{background:#111827;color:white;text-align:center;padding:25px;margin-top:35px}
@media(max-width:600px){
.hero h1{font-size:29px}
.two{grid-template-columns:1fr}
.grid{grid-template-columns:1fr 1fr}
.pic{height:145px}
.logo{font-size:17px}
}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">ZAD <span>PLUS</span> TECHNOLOGY</div>
<button class="cartbtn" id="cartBtn">🛒 Cart (<span id="cartCount">0</span>)</button>
</div>
</header>

<section class="hero">
<div class="wrap">
<h1>Security Products Online</h1>
<p>CCTV • GPS Tracker • Dashcam • Accessories</p>
</div>
</section>

<main class="wrap">
<div class="cats" id="categories"></div>
<div class="grid" id="products">Loading products...</div>
</main>

<footer>
<b>Zad Plus Technology</b>
<p>CCTV • GPS Tracker • Dashcam • Security Solutions</p>
</footer>

<!-- CART -->
<div class="overlay" id="cartOverlay">
<div class="modal">
<button class="close" id="closeCart">×</button>
<h2>Your Cart</h2>
<div id="cartList"></div>
<h3 style="text-align:right">Total ₹<span id="cartTotal">0</span></h3>
<button class="primary" id="checkoutBtn">Proceed to Checkout</button>
</div>
</div>

<!-- CHECKOUT -->
<div class="overlay" id="checkoutOverlay">
<div class="modal">
<button class="close" id="closeCheckout">×</button>
<h2>Place COD Order</h2>
<div class="msg" id="checkoutMsg"></div>

<form id="checkoutForm">
<div class="field">
<label>Full Name *</label>
<input id="customerName" required>
</div>

<div class="two">
<div class="field">
<label>Mobile Number *</label>
<input id="customerPhone" type="tel" required>
</div>
<div class="field">
<label>Email</label>
<input id="customerEmail" type="email">
</div>
</div>

<div class="field">
<label>Full Address *</label>
<textarea id="customerAddress" required></textarea>
</div>

<div class="two">
<div class="field">
<label>City</label>
<input id="customerCity">
</div>
<div class="field">
<label>State</label>
<input id="customerState">
</div>
</div>

<div class="two">
<div class="field">
<label>Pincode</label>
<input id="customerPincode">
</div>
<div class="field">
<label>Payment Method</label>
<select id="paymentMethod">
<option value="COD">Cash on Delivery</option>
</select>
</div>
</div>

<div class="field">
<label>Order Notes</label>
<textarea id="orderNotes"></textarea>
</div>

<button class="primary" id="placeOrderBtn" type="submit">
Place COD Order
</button>
</form>
</div>
</div>

<script>
const SUPABASE_URL =
"https://etnlcmfywrezmzcvmgyh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XIgHq_XORaC3lw0bJrsrnw_4p-18zec";

const WHATSAPP = "919097979200";

const $ = id => document.getElementById(id);
const money = n => Number(n || 0).toLocaleString("en-IN");

let products = [];
let categories = [];
let currentCategory = "All";
let cart = [];

try {
  cart = JSON.parse(localStorage.getItem("zadplus_cart") || "[]");
  if (!Array.isArray(cart)) cart = [];
} catch(e) {
  cart = [];
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, x => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[x]));
}

function isUUID(v) {
  return typeof v === "string" &&
  /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
}

async function api(path, options = {}) {
  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + path,
    {
      ...options,
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    }
  );

  const text = await response.text();
  let data = null;

  try {
    data = text ? JSON.parse(text) : null;
  } catch(e) {
    data = text;
  }

  if (!response.ok) {
    throw new Error(
      "Supabase " + response.status + ": " +
      (data?.message || data?.hint || data?.details || text)
    );
  }

  return data;
}

function saveCart() {
  localStorage.setItem("zadplus_cart", JSON.stringify(cart));
  $("cartCount").textContent =
    cart.reduce((sum, item) => sum + Number(item.qty || 0), 0);
}

async function loadProducts() {
  $("products").innerHTML = '<div class="empty">Loading products...</div>';

  try {
    products = await api("products?select=*&order=created_at.desc") || [];

    try {
      categories = await api("categories?select=id,name&order=name.asc") || [];
    } catch(e) {
      console.warn("Categories:", e);
      categories = [];
    }

    renderCategories();
    renderProducts();

  } catch(error) {
    $("products").innerHTML =
      '<div class="empty" style="grid-column:1/-1">' +
      'Products load nahi ho rahe.<p>' + esc(error.message) + '</p>' +
      '<button class="add" onclick="loadProducts()">Retry</button></div>';
  }
}

function renderCategories() {
  $("categories").innerHTML = "";

  const all = document.createElement("button");
  all.textContent = "All";
  all.className = currentCategory === "All" ? "active" : "";
  all.onclick = () => selectCategory("All");
  $("categories").appendChild(all);

  categories.forEach(c => {
    const btn = document.createElement("button");
    btn.textContent = c.name;
    btn.className = currentCategory === c.id ? "active" : "";
    btn.onclick = () => selectCategory(c.id);
    $("categories").appendChild(btn);
  });
}

function selectCategory(id) {
  currentCategory = id;
  renderCategories();
  renderProducts();
}

function renderProducts() {
  const list = currentCategory === "All"
    ? products
    : products.filter(p => p.category_id === currentCategory);

  if (!list.length) {
    $("products").innerHTML =
      '<div class="empty" style="grid-column:1/-1">No products found.</div>';
    return;
  }

  $("products").innerHTML = list.map(p => {
    const stock = Number(p.stock || 0);
    const img = p.image_url || p.image || "";

    return `
      <div class="card">
        <div class="pic">
          ${img ? `<img src="${esc(img)}" alt="${esc(p.name)}">` : "📦"}
        </div>
        <div class="info">
          <div class="name">${esc(p.name)}</div>
          <div class="price">₹${money(p.price)}</div>
          <div class="stock">Stock: ${stock}</div>
          <button class="add" ${stock <= 0 ? "disabled" : ""}
            onclick="addToCart('${p.id}')">
            ${stock > 0 ? "Add to Cart" : "Out of Stock"}
          </button>
        </div>
      </div>
    `;
  }).join("");
}

function addToCart(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;

  const stock = Number(p.stock || 0);
  if (stock <= 0) return alert("Out of stock");

  const item = cart.find(x => x.id === id);

  if (item) {
    if (item.qty < stock) item.qty++;
    else return alert("Stock limit reached");
  } else {
    cart.push({
      id: p.id,
      name: p.name,
      price: Number(p.price || 0),
      image_url: p.image_url || p.image || "",
      qty: 1,
      stock: stock
    });
  }

  saveCart();
  alert("Product added to cart");
}

function openCart() {
  renderCart();
  $("cartOverlay").style.display = "block";
}

function closeCart() {
  $("cartOverlay").style.display = "none";
}

function renderCart() {
  if (!cart.length) {
    $("cartList").innerHTML = '<div class="empty">Your cart is empty.</div>';
    $("cartTotal").textContent = "0";
    return;
  }

  $("cartList").innerHTML = cart.map((x, i) => `
    <div class="cartrow">
      <b>${esc(x.name)}</b>
      <div>₹${money(x.price)} × ${x.qty}</div>
      <div class="qty">
        <button onclick="changeQty(${i},-1)">−</button>
        <span>${x.qty}</span>
        <button onclick="changeQty(${i},1)">+</button>
        <button onclick="removeItem(${i})">Remove</button>
      </div>
    </div>
  `).join("");

  $("cartTotal").textContent = money(
    cart.reduce((a,x) => a + Number(x.price)*Number(x.qty),0)
  );
}

function changeQty(i, delta) {
  const item = cart[i];
  if (!item) return;

  item.qty += delta;

  if (item.qty <= 0) cart.splice(i,1);
  else if (item.qty > Number(item.stock || 999999))
    item.qty = Number(item.stock);

  saveCart();
  renderCart();
}

function removeItem(i) {
  cart.splice(i,1);
  saveCart();
  renderCart();
}

function openCheckout() {
  if (!cart.length) return alert("Cart empty hai");

  closeCart();
  $("checkoutMsg").className = "msg";
  $("checkoutMsg").textContent = "";
  $("checkoutOverlay").style.display = "block";
}

function closeCheckout() {
  $("checkoutOverlay").style.display = "none";
}

function showError(message) {
  $("checkoutMsg").className = "msg error";
  $("checkoutMsg").textContent = message;
}

$("cartBtn").onclick = openCart;
$("closeCart").onclick = closeCart;
$("checkoutBtn").onclick = openCheckout;
$("closeCheckout").onclick = closeCheckout;

/* UPDATED COD CHECKOUT */

$("checkoutForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  if (!cart.length) return showError("Cart empty hai");

  const btn = $("placeOrderBtn");
  btn.disabled = true;
  btn.textContent = "Saving Order...";

  const customer = {
    name: $("customerName").value.trim(),
    phone: $("customerPhone").value.trim(),
    email: $("customerEmail").value.trim() || null,
    address: $("customerAddress").value.trim(),
    city: $("customerCity").value.trim() || null,
    state: $("customerState").value.trim() || null,
    pincode: $("customerPincode").value.trim() || null
  };

  const subtotal = cart.reduce(
    (a,x) => a + Number(x.price)*Number(x.qty), 0
  );

  const notes = $("orderNotes").value.trim() || null;

  try {

    /* CUSTOMER TABLE INSERT REMOVED */

    /* SAVE DIRECTLY IN ORDERS TABLE */

    const orderResponse = await api("orders", {
      method: "POST",
      headers: {
        "Prefer": "return=representation"
      },
      body: JSON.stringify({
        customer_id: null,
        customer_name: customer.name,
        customer_phone: customer.phone,
        customer_email: customer.email,
        shipping_address: customer.address,
        city: customer.city,
        state: customer.state,
        pincode: customer.pincode,
        subtotal: subtotal,
        shipping_charge: 0,
        discount: 0,
        total_amount: subtotal,
        payment_method: "COD",
        payment_status: "pending",
        order_status: "new",
        notes: notes
      })
    });

    const order = orderResponse?.[0];

    if (!order?.id) {
      throw new Error("Order ID nahi mila.");
    }

    /* SAVE ORDER ITEMS */

    const items = cart.map(x => ({
      order_id: order.id,
      product_id: isUUID(x.id) ? x.id : null,
      product_name: x.name,
      quantity: Number(x.qty),
      price: Number(x.price),
      total: Number(x.price)*Number(x.qty)
    }));

    await api("order_items", {
      method: "POST",
      body: JSON.stringify(items)
    });

    /* SUCCESS */

    const itemText = cart.map(x =>
      `${x.name} x ${x.qty} = ₹${money(x.price*x.qty)}`
    ).join("\n");

    const message =
      `Zad Plus Technology Order\n` +
      `Order ID: ${order.id}\n\n` +
      `Customer: ${customer.name}\n` +
      `Mobile: ${customer.phone}\n` +
      `Address: ${customer.address}\n` +
      `City: ${customer.city || ""}\n` +
      `State: ${customer.state || ""}\n` +
      `Pincode: ${customer.pincode || ""}\n\n` +
      `Items:\n${itemText}\n\n` +
      `Total: ₹${money(subtotal)}\n` +
      `Payment: Cash on Delivery`;

    cart = [];
    saveCart();
    closeCheckout();

    alert("Order successfully saved!\nOrder ID: " + order.id);

    window.open(
      "https://wa.me/" + WHATSAPP +
      "?text=" + encodeURIComponent(message),
      "_blank"
    );

    loadProducts();

  } catch(error) {
    console.error("ORDER ERROR:", error);

    showError(
      "ORDER SAVE NAHI HUA.\n\n" +
      error.message +
      "\n\nCart safe hai. Error fix karke dobara try karein."
    );

  } finally {
    btn.disabled = false;
    btn.textContent = "Place COD Order";
  }
});

saveCart();
loadProducts();
</script>
</body>
</html>
