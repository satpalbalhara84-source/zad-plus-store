<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Zad Plus Technology</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#172033
}

header{
background:#111827;
color:#fff;
padding:14px 18px;
position:sticky;
top:0;
z-index:10
}

.nav{
max-width:1150px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:21px;
font-weight:800
}

.logo span{
color:#38bdf8
}

.cartbtn{
border:0;
border-radius:9px;
padding:10px 14px;
font-weight:700;
cursor:pointer
}

.hero{
background:linear-gradient(135deg,#0f172a,#1d4ed8);
color:#fff;
padding:45px 18px
}

.wrap{
max-width:1150px;
margin:auto;
padding:20px 18px
}

.hero h1{
margin:0 0 8px;
font-size:36px
}

.hero p{
margin:0
}

.cats{
display:flex;
gap:8px;
overflow:auto;
margin-bottom:18px
}

.cats button{
white-space:nowrap;
border:1px solid #ddd;
background:#fff;
border-radius:20px;
padding:9px 14px;
cursor:pointer
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
gap:17px
}

.card{
background:#fff;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 18px #0001
}

.pic{
height:185px;
background:#eef2f7;
display:flex;
align-items:center;
justify-content:center;
font-size:55px
}

.pic img{
width:100%;
height:100%;
object-fit:contain
}

.info{
padding:14px
}

.name{
font-weight:700;
min-height:42px
}

.price{
font-size:21px;
font-weight:800;
margin:8px 0
}

.add,
.primary{
width:100%;
border:0;
border-radius:9px;
padding:12px;
background:#2563eb;
color:#fff;
font-weight:800;
cursor:pointer
}

.add:disabled,
.primary:disabled{
opacity:.55;
cursor:not-allowed
}

.overlay{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:50;
padding:12px;
overflow:auto
}

.modal{
max-width:650px;
margin:20px auto;
background:#fff;
border-radius:17px;
padding:20px;
position:relative
}

.close{
position:absolute;
right:12px;
top:10px;
border:0;
border-radius:50%;
width:33px;
height:33px;
font-size:20px;
cursor:pointer
}

.cartrow{
display:flex;
gap:10px;
padding:12px 0;
border-bottom:1px solid #eee
}

.cartmain{
flex:1
}

.qty{
margin-top:7px
}

.qty button{
margin-right:5px;
padding:5px 9px;
cursor:pointer
}

.field{
margin:10px 0
}

.field label{
display:block;
font-size:13px;
font-weight:700;
margin-bottom:5px
}

.field input,
.field textarea,
.field select{
width:100%;
padding:11px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px
}

.field textarea{
min-height:70px
}

.two{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.msg{
display:none;
padding:11px;
border-radius:8px;
white-space:pre-wrap;
margin-bottom:12px
}

.error{
display:block;
background:#fee2e2;
color:#991b1b
}

.success{
display:block;
background:#dcfce7;
color:#166534
}

.empty{
padding:35px;
text-align:center
}

@media(max-width:600px){

.hero h1{
font-size:29px
}

.two{
grid-template-columns:1fr
}

.grid{
grid-template-columns:1fr 1fr
}

.pic{
height:150px
}

}

@media(max-width:390px){

.grid{
grid-template-columns:1fr
}

}
</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
ZAD <span>PLUS</span> TECHNOLOGY
</div>

<button class="cartbtn" id="cartBtn">
🛒 Cart (<span id="cartCount">0</span>)
</button>

</div>

</header>


<section class="hero">

<div class="wrap">

<h1>Security Products Online</h1>

<p>
CCTV • GPS Tracker • Dashcam • Accessories
</p>

</div>

</section>


<main class="wrap">

<div id="categories" class="cats"></div>

<div id="products" class="grid">
Loading products...
</div>

</main>


<!-- CART -->

<div id="cartOverlay" class="overlay">

<div class="modal">

<button class="close" id="closeCart">×</button>

<h2>Your Cart</h2>

<div id="cartList"></div>

<h3 style="text-align:right">
Total: ₹<span id="cartTotal">0</span>
</h3>

<button class="primary" id="checkoutBtn">
Proceed to Checkout
</button>

</div>

</div>


<!-- CHECKOUT -->

<div id="checkoutOverlay" class="overlay">

<div class="modal">

<button class="close" id="closeCheckout">
×
</button>

<h2>Place COD Order</h2>

<div id="checkoutMsg" class="msg"></div>


<form id="checkoutForm">


<div class="field">

<label>Name *</label>

<input
id="customerName"
required
>

</div>


<div class="two">

<div class="field">

<label>Mobile *</label>

<input
id="customerPhone"
type="tel"
required
>

</div>


<div class="field">

<label>Email</label>

<input
id="customerEmail"
type="email"
>

</div>

</div>


<div class="field">

<label>Address *</label>

<textarea
id="customerAddress"
required
></textarea>

</div>


<div class="two">

<div class="field">

<label>City</label>

<input id="customerCity">

</div>


<div class="field">

<label>State</label>

<input id="customerState">

</div>

</div>


<div class="two">

<div class="field">

<label>Pincode</label>

<input id="customerPincode">

</div>


<div class="field">

<label>Payment</label>

<select id="paymentMethod">

<option value="COD">
Cash on Delivery
</option>

</select>

</div>

</div>


<div class="field">

<label>Order Notes</label>

<textarea id="orderNotes"></textarea>

</div>


<button
class="primary"
id="placeOrderBtn"
type="submit"
>

Place COD Order

</button>


</form>

</div>

</div>



<script>


/* ================================
   SUPABASE SETTINGS
================================ */

const SUPABASE_URL =
"https://etnlcmfywrezmzcvmgyh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XIgqH_XORaC3lw0bJrsrnw_4p-18zec";

const WHATSAPP =
"919097979200";


/* ================================
   VARIABLES
================================ */

let products = [];

let cart =
JSON.parse(
localStorage.getItem("zadplus_cart") || "[]"
);

let currentCategory = "All";


/* ================================
   HELPERS
================================ */

const $ = id =>
document.getElementById(id);


function money(n){

return Number(n || 0)
.toLocaleString("en-IN");

}


function esc(v){

return String(v ?? "")
.replace(/[&<>"']/g,x=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[x]));

}


/* UUID CHECK */

function isUUID(v){

return typeof v === "string" &&
/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i
.test(v);

}


/* ================================
   SUPABASE API
================================ */

async function api(path,options={}){

const response =
await fetch(
SUPABASE_URL +
"/rest/v1/" +
path,
{

...options,

headers:{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY,

"Content-Type":
"application/json",

...(options.headers || {})

}

});


const text =
await response.text();


let data = null;

try{

data =
text ? JSON.parse(text) : null;

}catch(e){

data = text;

}


/* IMPORTANT:
   ERROR HIDE NAHI HOGA
*/

if(!response.ok){

let detail =
data?.message ||
data?.hint ||
data?.details ||
text ||
response.statusText;

throw new Error(
"Supabase " +
response.status +
": " +
detail
);

}


return data;

}


/* ================================
   CART
================================ */

function saveCart(){

localStorage.setItem(
"zadplus_cart",
JSON.stringify(cart)
);

updateCartCount();

}


function updateCartCount(){

$("cartCount").textContent =
cart.reduce(
(a,x)=>
a + Number(x.qty || 0),
0
);

}


/* ================================
   CATEGORIES
================================ */

async function loadCategories(){

try{

const data =
await api(
"categories?select=id,name&order=name.asc"
);


$("categories").innerHTML =

`<button
onclick="selectCategory('All')">
All
</button>` +

(data || [])
.map(c=>`

<button
onclick="selectCategory('${c.id}')">

${esc(c.name)}

</button>

`)
.join("");


}catch(error){

console.log(
"Category error:",
error
);

}

}


function selectCategory(id){

currentCategory = id;

renderProducts();

}


/* ================================
   PRODUCTS
================================ */

async function loadProducts(){

$("products").innerHTML =
'<div class="empty">Loading products...</div>';


try{

products =
await api(
"products?select=*&order=created_at.desc"
) || [];


await loadCategories();

renderProducts();


}catch(error){

console.error(error);


$("products").innerHTML = `

<div
class="empty"
style="grid-column:1/-1">

<b>
Products load nahi ho rahe.
</b>

<br><br>

${esc(error.message)}

<br><br>

<button
class="add"
onclick="loadProducts()">

Retry

</button>

</div>

`;

}

}


function renderProducts(){

let list =
currentCategory === "All"

? products

: products.filter(
p =>
p.category_id ===
currentCategory
);


if(!list.length){

$("products").innerHTML = `

<div
class="empty"
style="grid-column:1/-1">

No products found.

</div>

`;

return;

}


$("products").innerHTML =

list.map(p=>{

let stock =
Number(p.stock || 0);

let img =
p.image_url ||
p.image ||
"";


return `

<div class="card">


<div class="pic">

${
img

?

`<img
src="${esc(img)}"
onerror="this.style.display='none'">`

:

"📦"

}

</div>


<div class="info">


<div class="name">

${esc(p.name)}

</div>


<div class="price">

₹${money(p.price)}

</div>


<div>

Stock: ${stock}

</div>


<button
class="add"
${stock <= 0 ? "disabled" : ""}
onclick="addToCart('${p.id}')">

${
stock > 0
?
"Add to Cart"
:
"Out of Stock"
}

</button>


</div>

</div>

`;

}).join("");

}


/* ================================
   ADD TO CART
================================ */

function addToCart(id){

const p =
products.find(
x => x.id === id
);

if(!p)return;


const stock =
Number(p.stock || 0);


if(stock <= 0){

alert("Product out of stock");

return;

}


const item =
cart.find(
x => x.id === id
);


if(item){

if(item.qty < stock){

item.qty++;

}

}else{

cart.push({

id:p.id,

name:p.name,

price:Number(p.price || 0),

image_url:
p.image_url ||
p.image ||
"",

qty:1,

stock:stock

});

}


saveCart();

alert(
"Product added to cart"
);

}


/* ================================
   CART OPEN
================================ */

function openCart(){

renderCart();

$("cartOverlay").style.display =
"block";

}


function closeCart(){

$("cartOverlay").style.display =
"none";

}


function renderCart(){

if(!cart.length){

$("cartList").innerHTML =
'<div class="empty">Cart empty hai.</div>';

$("cartTotal").textContent =
"0";

return;

}


$("cartList").innerHTML =

cart.map((x,i)=>`

<div class="cartrow">

<div class="cartmain">

<b>
${esc(x.name)}
</b>

<br>

₹${money(x.price)}
× ${x.qty}


<div class="qty">

<button
onclick="changeQty(${i},-1)">

−

</button>


${x.qty}


<button
onclick="changeQty(${i},1)">

+

</button>


<button
onclick="removeItem(${i})">

Remove

</button>

</div>

</div>

</div>

`)
.join("");


$("cartTotal").textContent =
money(
cart.reduce(
(a,x)=>
a +
Number(x.price) *
Number(x.qty),
0
)
);

}


function changeQty(i,d){

cart[i].qty += d;


if(cart[i].qty <= 0){

cart.splice(i,1);

}else if(
cart[i].qty >
Number(cart[i].stock || 999999)
){

cart[i].qty =
Number(cart[i].stock);

}


saveCart();

renderCart();

}


function removeItem(i){

cart.splice(i,1);

saveCart();

renderCart();

}


/* ================================
   CHECKOUT
================================ */

function openCheckout(){

if(!cart.length){

alert(
"Cart empty hai."
);

return;

}


closeCart();


$("checkoutMsg").className =
"msg";

$("checkoutMsg").textContent =
"";


$("checkoutOverlay").style.display =
"block";

}


function closeCheckout(){

$("checkoutOverlay").style.display =
"none";

}


function showError(text){

$("checkoutMsg").className =
"msg error";

$("checkoutMsg").textContent =
text;

}


/* ================================
   BUTTONS
================================ */

$("cartBtn").onclick =
openCart;

$("closeCart").onclick =
closeCart;

$("checkoutBtn").onclick =
openCheckout;

$("closeCheckout").onclick =
closeCheckout;


/* ================================
   PLACE ORDER
================================ */

$("checkoutForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();


if(!cart.length){

showError(
"Cart empty hai."
);

return;

}


const btn =
$("placeOrderBtn");


btn.disabled = true;

btn.textContent =
"Saving Order...";


/* CUSTOMER DATA */

const customer = {

name:
$("customerName")
.value.trim(),

phone:
$("customerPhone")
.value.trim(),

email:
$("customerEmail")
.value.trim() ||
null,

address:
$("customerAddress")
.value.trim(),

city:
$("customerCity")
.value.trim() ||
null,

state:
$("customerState")
.value.trim() ||
null,

pincode:
$("customerPincode")
.value.trim() ||
null

};


const notes =
$("orderNotes")
.value.trim() ||
null;


const payment =
$("paymentMethod")
.value;


const subtotal =
cart.reduce(

(a,x)=>
a +
Number(x.price) *
Number(x.qty),

0

);


try{


/* =================================
   STEP 1
   SAVE CUSTOMER
================================= */

const customerResponse =
await api(
"customers",
{

method:"POST",

headers:{
"Prefer":
"return=representation"
},

body:
JSON.stringify(customer)

}
);


const customerId =
customerResponse?.[0]?.id ||
null;


/* =================================
   STEP 2
   SAVE MAIN ORDER
================================= */

const orderResponse =
await api(
"orders",
{

method:"POST",

headers:{
"Prefer":
"return=representation"
},

body:
JSON.stringify({

customer_id:
customerId,

customer_name:
customer.name,

customer_phone:
customer.phone,

customer_email:
customer.email,

shipping_address:
customer.address,

city:
customer.city,

state:
customer.state,

pincode:
customer.pincode,

subtotal:
subtotal,

shipping_charge:
0,

discount:
0,

total_amount:
subtotal,

payment_method:
payment,

payment_status:
"pending",

order_status:
"new",

notes:
notes

})

}
);


const order =
orderResponse?.[0];


if(!order?.id){

throw new Error(
"Order ID nahi mila. Orders table insert check karein."
);

}


/* =================================
   STEP 3
   SAVE ORDER ITEMS
================================= */

const items =
cart.map(x=>({

order_id:
order.id,

/*
product_id nullable hai.
Agar UUID valid hai tabhi save hoga.
*/

product_id:
isUUID(x.id)
?
x.id
:
null,

product_name:
x.name,

quantity:
Number(x.qty),

price:
Number(x.price),

total:
Number(x.price) *
Number(x.qty)

}));


await api(
"order_items",
{

method:"POST",

headers:{
"Prefer":
"return=representation"
},

body:
JSON.stringify(items)

}
);


/* =================================
   DATABASE SUCCESS
   AB WHATSAPP
================================= */

const itemText =
cart.map(x=>

`${x.name} x ${x.qty} = ₹${money(
Number(x.price) *
Number(x.qty)
)}`

).join("\n");


const message =

`Zad Plus Technology Order\n` +

`Order ID: ${order.id}\n\n` +

`Customer: ${customer.name}\n` +

`Mobile: ${customer.phone}\n` +

`Address: ${customer.address}\n` +

`City: ${customer.city || ""}\n` +

`State: ${customer.state || ""}\n` +

`Pincode: ${customer.pincode || ""}\n\n` +

`Items:\n${itemText}\n\n` +

`Total: ₹${money(subtotal)}\n` +

`Payment: ${payment}`;


/*
ONLY AFTER DATABASE SUCCESS
*/

cart = [];

saveCart();

closeCheckout();


alert(
"Order successfully saved!\n\n" +
"Order ID: " +
order.id
);


/*
OPEN WHATSAPP
*/

window.open(

"https://wa.me/" +
WHATSAPP +
"?text=" +
encodeURIComponent(message),

"_blank"

);


/*
REFRESH PRODUCTS
*/

loadProducts();


}catch(error){


console.error(
"ORDER ERROR:",
error
);


/*
IMPORTANT:
ERROR USER KO DIKHEGA
*/

showError(

"ORDER SAVE NAHI HUA.\n\n" +

error.message +

"\n\n" +

"Cart delete nahi hua hai. " +

"Error fix hone ke baad dobara try karein."

);


}finally{


btn.disabled = false;

btn.textContent =
"Place COD Order";


}

});


/* ================================
   START
================================ */

updateCartCount();

loadProducts();

</script>

</body>
</html>
